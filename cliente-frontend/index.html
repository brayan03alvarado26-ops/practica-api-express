<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Libros</title>

  <!-- Librería externa de visualización: Chart.js vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }
    header {
      background: #1e3a8a;
      color: #fff;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 6px 0 0; opacity: .85; }
    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    section {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    section h2 { margin-top: 0; font-size: 1.2rem; color: #1e3a8a; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #eef2ff; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .estado { color: #6b7280; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <h1>Catálogo de Libros</h1>
    <p>Datos consumidos desde la API REST (Express + PostgreSQL)</p>
  </header>

  <main>
    <!-- Contenedor de la tabla con los registros -->
    <section>
      <h2>Registros</h2>
      <div id="tabla-datos">
        <p class="estado">Cargando datos...</p>
      </div>
    </section>

    <!-- Contenedor de la gráfica -->
    <section>
      <h2>Precio por libro (MXN)</h2>
      <canvas id="miGrafica"></canvas>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
